name: Interview demo checks
on:
  pull_request:
  push:
    branches: ['interview-demo/**']
jobs:
  local-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: node scripts/check-doc-links.js
      - run: npm test
